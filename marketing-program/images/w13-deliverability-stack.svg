<svg xmlns="http://www.w3.org/2000/svg" width="760" height="402" viewBox="0 0 760 402" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Deliverability stack</text><rect x="110.0" y="60" width="540" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="92.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Content: plain, relevant, easy to unsubscribe</text><rect x="90.0" y="134" width="580" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="380.0" y="166.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">List hygiene: double opt-in, remove bounces, sunset inactive</text><rect x="70.0" y="208" width="620" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="240.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Reputation: warm up domains, consistent volume</text><rect x="50.0" y="282" width="660" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380.0" y="314.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Authentication: SPF, DKIM, DMARC on a sending subdomain</text><text x="380.0" y="376.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Gmail and Yahoo require authentication and low spam rates for bulk senders. Get the base right before you</text><text x="380.0" y="391.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">write a single campaign.</text></svg>