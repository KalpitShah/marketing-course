<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Before you trust an A/B test</text><rect x="50.0" y="60" width="660" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="92.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Decide and document, including the null result</text><rect x="70.0" y="134" width="620" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="380.0" y="166.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Run the full pre-set duration, ignore early peeks</text><rect x="90.0" y="208" width="580" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="230.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Sample size computed in advance for the minimum effect you care</text><text x="380.0" y="249.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">about</text><rect x="110.0" y="282" width="540" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380.0" y="314.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">One clear hypothesis and one primary metric</text><rect x="130.0" y="356" width="500" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="380.0" y="378.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Random assignment that actually works, verified with an</text><text x="380.0" y="397.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">A/A test</text></svg>