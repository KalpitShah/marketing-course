<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="470.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Dramatic structure, applied to a customer story</text><line x1="80" y1="390" x2="250" y2="320" stroke="#2563eb" stroke-width="3.5"/><line x1="250" y1="320" x2="420" y2="210" stroke="#2563eb" stroke-width="3.5"/><line x1="420" y1="210" x2="560" y2="140" stroke="#2563eb" stroke-width="3.5"/><line x1="560" y1="140" x2="700" y2="260" stroke="#2563eb" stroke-width="3.5"/><line x1="700" y1="260" x2="870" y2="330" stroke="#2563eb" stroke-width="3.5"/><circle cx="80" cy="390" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="80" y="420.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Exposition</text><text x="80" y="452.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the world before</text><circle cx="250" cy="320" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="250" y="350.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Rising action</text><text x="250" y="382.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">attempts that fail</text><circle cx="420" cy="210" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="420" y="184.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Complication</text><text x="420" y="144.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the cost of not</text><text x="420" y="159.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">solving it</text><circle cx="560" cy="140" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="560" y="114.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Climax</text><text x="560" y="82.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the decision to switch</text><circle cx="700" cy="260" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="700" y="290.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Falling action</text><text x="700" y="322.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">rollout and adoption</text><circle cx="870" cy="330" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="870" y="360.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:700;">Resolution</text><text x="870" y="384.9" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the new normal, with</text><text x="870" y="399.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">numbers</text><text x="470.0" y="462.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Founders cut the rising action because it is unflattering. That is the part that makes the resolution believable.</text></svg>