<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">The four forces of a switch (Jobs to be Done)</text><rect x="330" y="180" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="225.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Buyer decides to switch</text><rect x="40" y="90" width="240" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="160.0" y="115.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Push of the current situation</text><text x="160.0" y="137.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">pain with the status quo</text><rect x="620" y="90" width="240" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="740.0" y="115.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Pull of the new solution</text><text x="740.0" y="137.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">attraction of your product</text><rect x="40" y="300" width="240" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="160.0" y="325.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Anxiety about the new</text><text x="160.0" y="347.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">will it work for us? is it risky?</text><rect x="620" y="300" width="240" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="740.0" y="325.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Habit of the present</text><text x="740.0" y="347.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">inertia, switching cost, comfort</text><path d="M280,125 L330,200" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/><path d="M620,125 L570,200" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/><path d="M330,250 L280,335" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/><path d="M570,250 L620,335" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/><text x="450.0" y="422.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Progress happens when push plus pull outweighs anxiety plus habit. Your messaging has to work on all four, not just pull.</text></svg>