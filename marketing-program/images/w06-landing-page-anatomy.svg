<svg xmlns="http://www.w3.org/2000/svg" width="760" height="558" viewBox="0 0 760 558" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Anatomy of a high-converting software landing page</text><rect x="50.0" y="60" width="660" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="92.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Final call to action and FAQ</text><rect x="70.0" y="134" width="620" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="380.0" y="166.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Pricing or plan summary</text><rect x="90.0" y="208" width="580" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="240.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Social proof: logos, quotes, numbers</text><rect x="110.0" y="282" width="540" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380.0" y="314.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">How it works: 3 steps or a short demo</text><rect x="130.0" y="356" width="500" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="380.0" y="388.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Problem and outcome: why this matters</text><rect x="150.0" y="430" width="460" height="64" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/><text x="380.0" y="452.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Hero: headline, subhead, proof, one CTA, product</text><text x="380.0" y="471.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">visual</text><text x="380.0" y="532.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Order matters less than clarity. A visitor should know what it is, who it is for, and why it is better</text><text x="380.0" y="547.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">within 5 seconds.</text></svg>