<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Customer story arc (use for case studies, demos and founder stories)</text><line x1="80" y1="320" x2="250" y2="280" stroke="#2563eb" stroke-width="3"/><line x1="250" y1="280" x2="420" y2="300" stroke="#2563eb" stroke-width="3"/><line x1="420" y1="300" x2="560" y2="140" stroke="#2563eb" stroke-width="3"/><line x1="560" y1="140" x2="720" y2="160" stroke="#2563eb" stroke-width="3"/><line x1="720" y1="160" x2="840" y2="110" stroke="#2563eb" stroke-width="3"/><circle cx="80" cy="320" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="80" y="348.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Ordinary world</text><circle cx="250" cy="280" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="252.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Trigger event</text><circle cx="420" cy="300" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="420" y="328.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Failed attempts</text><circle cx="560" cy="140" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="560" y="112.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Turning point</text><circle cx="720" cy="160" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="720" y="188.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">New normal</text><circle cx="840" cy="110" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="840" y="82.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Proof</text><text x="450.0" y="402.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Tension comes from the failed attempts. Without them the story is a feature list.</text></svg>