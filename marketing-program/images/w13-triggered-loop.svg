<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">A triggered email is a feedback loop</text><rect x="60" y="170" width="180" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="150.0" y="200.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Target behavior</text><text x="150.0" y="222.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the activation event</text><rect x="300" y="170" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="390.0" y="200.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Compare</text><text x="390.0" y="222.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">did it happen in time?</text><rect x="540" y="170" width="180" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="630.0" y="200.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Send email</text><text x="630.0" y="222.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">the corrective nudge</text><rect x="780" y="170" width="140" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="850.0" y="200.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">User acts</text><text x="850.0" y="222.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">or does not</text><path d="M242,210 L298,210" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M482,210 L538,210" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M722,210 L778,210" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M850,252 L850,340 L390,340 L390,254" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="620" y="358.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">product usage feeds back into the comparison</text><text x="480.0" y="402.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Scheduled blasts have no feedback path. Triggered emails do, which is why they convert better and annoy people less.</text></svg>