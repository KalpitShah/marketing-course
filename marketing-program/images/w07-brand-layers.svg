<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="360.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">What a software brand is made of</text><circle cx="360.0" cy="330.0" r="250.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="360.0" cy="330.0" r="187.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="360.0" cy="330.0" r="125.0" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><circle cx="360.0" cy="330.0" r="62.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="360.0" y="320.9" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Promise: the one thing</text><text x="360.0" y="339.1" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">customers can count on</text><text x="360.0" y="227.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Personality and voice:</text><text x="360.0" y="245.3" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">how it sounds</text><text x="360.0" y="155.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Distinctive assets:</text><text x="360.0" y="173.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">name, logo, color,</text><text x="360.0" y="192.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">mascot, sound</text><text x="360.0" y="93.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Experience: every</text><text x="360.0" y="111.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">touchpoint from ad to</text><text x="360.0" y="129.4" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">invoice</text><text x="360.0" y="622.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Brand is the memory people have of you. Distinctive assets make that memory retrievable.</text></svg>