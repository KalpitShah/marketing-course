<svg xmlns="http://www.w3.org/2000/svg" width="760" height="402" viewBox="0 0 760 402" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Messaging hierarchy</text><rect x="110.0" y="60" width="540" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="81.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Proof points (numbers, logos, quotes, demos)</text><text x="380.0" y="105.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">evidence for every claim above</text><rect x="90.0" y="134" width="580" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="380.0" y="155.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Supporting messages (3 to 4 reasons to believe)</text><text x="380.0" y="179.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">each maps to a unique attribute</text><rect x="70.0" y="208" width="620" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="229.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Value proposition (the outcome for the best-fit customer)</text><text x="380.0" y="253.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">written in the customer&#x27;s words</text><rect x="50.0" y="282" width="660" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380.0" y="303.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">One-line position (what you are, for whom)</text><text x="380.0" y="327.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">anchored in the category you chose</text><text x="380.0" y="384.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Top of the pyramid is what people remember. The base is what makes them believe it.</text></svg>