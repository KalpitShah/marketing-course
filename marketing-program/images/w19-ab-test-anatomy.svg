<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Anatomy of an A/B test</text><rect x="390" y="70" width="180" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="480.0" y="100.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Incoming traffic</text><rect x="180" y="190" width="230" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="295.0" y="224.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Variant A (control)</text><text x="295.0" y="248.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">the current page</text><rect x="550" y="190" width="230" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="665.0" y="224.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Variant B</text><text x="665.0" y="248.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">one change, one hypothesis</text><path d="M450,132 L320,186" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="368.5" y="149.0" width="33" height="20" rx="6" fill="#ffffff"/><text x="385.0" y="159.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">50%</text><path d="M510,132 L640,186" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="558.5" y="149.0" width="33" height="20" rx="6" fill="#ffffff"/><text x="575.0" y="159.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">50%</text><rect x="180" y="320" width="230" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="295.0" y="348.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Conversion rate A</text><rect x="550" y="320" width="230" height="56" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="665.0" y="348.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Conversion rate B</text><path d="M295,282 L295,316" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M665,282 L665,316" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="400" width="300" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="480.0" y="423.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Difference, with its uncertainty</text><path d="M340,378 L440,398" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M620,378 L520,398" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="228.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">Random assignment,</text><text x="80" y="246.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">fixed duration,</text><text x="80" y="264.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">one primary metric</text></svg>