<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Feature to benefit to outcome</text><rect x="30.0" y="78.0" width="214.0" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="137.0" y="110.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Feature</text><text x="137.0" y="132.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">what it is: &#x27;real-time sync&#x27;</text><path d="M246.0,120.0 L268.0,120.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="272.0" y="78.0" width="214.0" height="84" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="379.0" y="110.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Benefit</text><text x="379.0" y="132.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">what it does: &#x27;no stale data&#x27;</text><path d="M488.0,120.0 L510.0,120.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="514.0" y="78.0" width="214.0" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="621.0" y="110.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Outcome</text><text x="621.0" y="125.4" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">why they care: &#x27;ship reports the</text><text x="621.0" y="139.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">same day&#x27;</text><path d="M730.0,120.0 L752.0,120.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="756.0" y="78.0" width="214.0" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="863.0" y="110.2" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;fill:#1f2937;font-weight:600;">Proof</text><text x="863.0" y="125.4" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">&#x27;Acme cut reporting from 3 days</text><text x="863.0" y="139.8" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;fill:#6b7280;font-weight:normal;">to 3 hours&#x27;</text><text x="500.0" y="202.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Founders write features. Buyers buy outcomes. Every message should be able to walk this chain in both directions.</text></svg>