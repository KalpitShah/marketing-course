<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Funnel versus loop</text><polygon points="60.0,80 360.0,80 337.5,144 82.5,144" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="210.0" y="112.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Visitors</text><polygon points="82.5,150 337.5,150 315.0,214 105.0,214" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="210.0" y="182.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Signups</text><polygon points="105.0,220 315.0,220 292.5,284 127.5,284" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="210.0" y="252.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Activated</text><polygon points="127.5,290 292.5,290 270.0,354 150.0,354" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="210.0" y="322.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Paying</text><text x="210.0" y="385.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#6b7280;font-weight:normal;">Linear: every user costs new input</text><rect x="640.0" y="82.0" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="110.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">New user</text><rect x="760.0" y="202.0" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="840.0" y="230.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Uses product</text><rect x="640.0" y="322.0" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="341.6" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Creates output or</text><text x="720.0" y="358.4" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">invite</text><rect x="520.0" y="202.00000000000003" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="600.0" y="230.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2937;font-weight:600;">Reaches others</text><path d="M752.2426406871193,142.2426406871193 Q792.7279220613578,157.27207793864216 807.7573593128807,197.7573593128807" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M807.7573593128807,262.24264068711926 Q792.7279220613578,302.72792206135784 752.2426406871193,317.75735931288074" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M687.7573593128807,317.75735931288074 Q647.2720779386422,302.72792206135784 632.2426406871193,262.2426406871193" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M632.2426406871193,197.75735931288074 Q647.2720779386422,157.27207793864216 687.7573593128807,142.2426406871193" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="385.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#6b7280;font-weight:normal;">Compounding: output of one cycle is input to the next</text><text x="500.0" y="442.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;font-style:italic;">Reforge&#x27;s framing. Funnels describe a journey; loops describe an engine. Design for loops, measure with funnels.</text></svg>