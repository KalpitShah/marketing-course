<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="30" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#1f2937">Distinctive versus differentiated</text><rect x="114.0" y="74.0" width="297.0" height="212.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="262.5" y="169.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Recognizable but generic</text><text x="262.5" y="193.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">known, but for nothing in particular</text><rect x="419.0" y="74.0" width="297.0" height="212.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="567.5" y="169.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">The goal</text><text x="567.5" y="185.7" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">instantly recognizable and clearly better</text><text x="567.5" y="201.3" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">for someone</text><rect x="114.0" y="294.0" width="297.0" height="212.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="262.5" y="389.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Invisible</text><text x="262.5" y="405.7" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">no one remembers you and nothing stands</text><text x="262.5" y="421.3" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">out</text><rect x="419.0" y="294.0" width="297.0" height="212.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="567.5" y="389.5" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;fill:#1f2937;font-weight:600;">Better but unknown</text><text x="567.5" y="405.7" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">great product, no memory; the common</text><text x="567.5" y="421.3" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#6b7280;font-weight:normal;">founder trap</text><path d="M110,518 L720,518" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><path d="M102,510 L102,70" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><text x="415.0" y="540.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#6b7280;font-weight:600;">Differentiated (meaningfully different from rivals)</text><g transform="translate(80,290.0) rotate(-90)"><text x="0" y="0.0" text-anchor="middle" dominant-baseline="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#6b7280;font-weight:600;">Distinctive (easily recognized and recalled)</text></g></svg>